# -----------------------------------------------------------------------------
# 🔒 SECURITY CHANGES IN THIS VERSION (vs. baseline):
# 1. InstanceSecurityGroup and EndpointSecurityGroup now explicitly remove the
#    DEFAULT "allow all outbound" rule that EC2 attaches automatically to every
#    new security group. Previously, egress was added only via separate
#    AWS::EC2::SecurityGroupEgress resources — which does NOT remove the
#    default 0.0.0.0/0 egress rule that ships with the group. Both groups now
#    carry a placeholder deny-like rule inline (127.0.0.1/32) purely to
#    suppress that default; the actual egress is still defined below.
# 2. EndpointSecurityGroup ingress is now scoped to InstanceSecurityGroup by
#    Security Group reference (SG-to-SG), not to the whole VPC CIDR.
# 3. All four VPC Endpoints (S3 Gateway, SSM, SSMMessages, EC2Messages) now
#    carry an explicit endpoint policy, so a compromised instance role can't
#    reach arbitrary S3 buckets or SSM resources through the endpoint — only
#    what's explicitly allowed.
# 4. IAM Role gains an optional, separately-scoped policy for backup
#    repository access (Put/Get/List/Delete + KMS), only added if you supply
#    VeeamRepositoryBucketName. The original installer-download permissions
#    (ISO/license) remain read-only and scoped to S3BucketName/*, unchanged.
# -----------------------------------------------------------------------------
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Veeam Data Platform Premium v13.1 on Windows Server 2025, 100% isolated
  network via SSM (no IGW/NAT). C: 120GB (OS), D: 450GB (repository).
  Replace [ENTER_YOUR_*] placeholders before deploying. See inline comments
  for the S3 prefix list lookup command and full security changelog.

# ---------------------------------------------------------------------------
# PARAMETERS
# ---------------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Type: String
    Default: veeam-prod
    Description: Prefix applied to every resource name/tag.

  AWSRegion:
    Type: String
    Default: us-east-2
    Description: AWS Region where resources will be deployed (e.g., us-east-2, us-west-1, eu-west-1)
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-central-1
      - ap-southeast-1
      - ap-southeast-2

  VpcCIDR:
    Type: String
    Default: 10.10.0.0/16
    Description: CIDR block for the VPC.

  PrivateSubnetCIDR:
    Type: String
    Default: 10.10.1.0/24
    Description: CIDR block for the private subnet.

  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type (4 vCPU / 16 GB RAM).

  WindowsAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2025-English-Full-Base
    Description: Latest Windows Server 2025 Full AMI (automatically resolved from SSM Parameter Store).

  VeeamISOUrl:
    Type: String
    NoEcho: false
    Description: |
      S3 path to Veeam ISO (without https:// prefix).
      Example: s3://your-bucket-name/path/to/VeeamDataPlatformPremium_v13.1.iso

      [ENTER_YOUR_S3_ISO_PATH_HERE]
    Default: s3://[ENTER_YOUR_BUCKET_NAME]/ISO-Veeam/VeeamDataPlatformPremium_v13.1_20260728.iso

  VeeamLicenseUrl:
    Type: String
    NoEcho: false
    Description: |
      S3 path to Veeam license file (without https:// prefix).
      Example: s3://your-bucket-name/path/to/veeam_license.lic

      [ENTER_YOUR_S3_LICENSE_PATH_HERE]
    Default: s3://[ENTER_YOUR_BUCKET_NAME]/veeam_data_platform_premium_nfr_100.lic

  S3BucketName:
    Type: String
    Description: |
      Name of the S3 bucket containing the Veeam ISO and license.
      This is used to create IAM permissions and the S3 Gateway Endpoint policy.

      [ENTER_YOUR_S3_BUCKET_NAME_HERE]
    Default: "[ENTER_YOUR_BUCKET_NAME]"

  S3PrefixListId:
    Type: String
    Description: |
      Managed prefix list ID for com.amazonaws.<region>.s3

      Find it with:
        aws ec2 describe-prefix-lists \
          --filters Name=prefix-list-name,Values=com.amazonaws.[REGION].s3 \
          --query "PrefixLists[0].PrefixListId" --output text --region [REGION]

      Example: pl-12345678

      [ENTER_YOUR_S3_PREFIX_LIST_ID_HERE]
    Default: "[ENTER_YOUR_S3_PREFIX_LIST_ID_HERE]"

  VeeamRepositoryBucketName:
    Type: String
    Default: ""
    Description: |
      OPTIONAL. Name of the S3 bucket used as the Veeam backup repository
      (only if different from S3BucketName / if you're using S3 as a backup
      target from this server). Leave blank to skip repository IAM
      permissions and the corresponding S3 Gateway Endpoint policy statement
      entirely — this template does not require it to function.

  VeeamRepositoryKmsKeyArn:
    Type: String
    Default: ""
    Description: |
      OPTIONAL. ARN of the KMS key used to encrypt the backup repository
      bucket (SSE-KMS). Leave blank if the bucket uses SSE-S3, or if
      VeeamRepositoryBucketName is also blank.

# ---------------------------------------------------------------------------
# CONDITIONS
# ---------------------------------------------------------------------------
Conditions:
  HasRepositoryBucket: !Not [!Equals [!Ref VeeamRepositoryBucketName, ""]]
  HasRepositoryKmsKey: !Not [!Equals [!Ref VeeamRepositoryKmsKeyArn, ""]]

# ---------------------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # VPC
  # -------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  # -------------------------------------------------------------------------
  # PRIVATE SUBNET  (no route to internet, no IGW)
  # -------------------------------------------------------------------------
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCIDR
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-subnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # -------------------------------------------------------------------------
  # VPC ENDPOINTS — SSM (no internet required)
  # Each endpoint now carries an explicit endpoint policy. SSM's control-plane
  # APIs don't support fine-grained resource ARNs the way S3 does, so the
  # meaningful restriction here is "same AWS account only" — combined with
  # the IAM role's own least-privilege policy, this closes the gap where a
  # compromised instance could otherwise reach SSM resources belonging to
  # other principals through the endpoint.
  # -------------------------------------------------------------------------
  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWSRegion}.ssm
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSameAccountOnly
            Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWSRegion}.ssmmessages
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSameAccountOnly
            Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWSRegion}.ec2messages
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSameAccountOnly
            Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  # S3 Gateway endpoint so UserData can pull the ISO/license from S3
  # without leaving the AWS network. Policy restricts reachable buckets to:
  #   - S3BucketName (installer ISO/license, read-only)
  #   - the public "aws-cli" bucket (needed to download AWSCLIV2.msi)
  #   - VeeamRepositoryBucketName, only if that parameter was supplied
  # Any other bucket in the account or elsewhere is unreachable through this
  # endpoint, regardless of what the IAM role would otherwise allow.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWSRegion}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowInstallerBucket
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::${S3BucketName}
              - !Sub arn:aws:s3:::${S3BucketName}/*
          - Sid: AllowAwsCliInstallerBucket
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
            Resource:
              - arn:aws:s3:::aws-cli
              - arn:aws:s3:::aws-cli/*
          - !If
            - HasRepositoryBucket
            - Sid: AllowRepositoryBucket
              Effect: Allow
              Principal: "*"
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource:
                - !Sub arn:aws:s3:::${VeeamRepositoryBucketName}
                - !Sub arn:aws:s3:::${VeeamRepositoryBucketName}/*
            - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # SECURITY GROUPS
  # -------------------------------------------------------------------------

  # Attached to all Interface VPC Endpoints — allows HTTPS from the
  # VeeamServer's own security group only (SG-to-SG reference), not from
  # the whole VPC CIDR. No egress is required: security groups are stateful,
  # so return traffic for the inbound HTTPS connection is allowed
  # automatically. The inline SecurityGroupEgress placeholder below exists
  # solely to remove the default "allow all outbound" rule that EC2 attaches
  # to every new security group.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS inbound from VeeamServer SG only; no outbound needed.
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: "Placeholder — removes default allow-all-outbound. No real egress needed (SG is stateful)."
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-endpoint-sg

  # Defined as a separate resource (not inline) to avoid a circular
  # dependency: this rule references InstanceSecurityGroup, and
  # InstanceSecurityGroup's egress rules (below) reference this group back.
  EndpointSecurityGroupIngressFromInstance:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Description: HTTPS from Veeam Server security group only

  # Attached to the EC2 instance — no inbound rules needed (SSM doesn't
  # require open ports). Egress is scoped to exactly what the instance
  # needs: HTTPS to the interface VPC endpoints (SSM/SSMMessages/
  # EC2Messages) and HTTPS to S3 via the Gateway Endpoint's managed prefix
  # list. The inline SecurityGroupEgress placeholder removes the default
  # 0.0.0.0/0 egress rule — without it, the two scoped
  # AWS::EC2::SecurityGroupEgress resources below would only ADD rules
  # alongside the default allow-all, not replace it.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Veeam server - no inbound, egress restricted to VPC endpoints only
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: "Placeholder — removes default allow-all-outbound. Real egress defined via explicit rules below."
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-instance-sg

  InstanceSecurityGroupEgressEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: HTTPS to interface VPC endpoints (SSM / SSMMessages / EC2Messages)

  InstanceSecurityGroupEgressS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId
      Description: HTTPS to S3 via Gateway Endpoint

  # -------------------------------------------------------------------------
  # IAM ROLE FOR EC2 (SSM + S3 access)
  # Trust policy already scoped to ec2.amazonaws.com only (kept as-is).
  # Two separate inline policies:
  #   1. VeeamInstallerReadAccess — always present, read-only, scoped to
  #      S3BucketName/* (ISO + license download). Unchanged in intent from
  #      the baseline template.
  #   2. VeeamRepositoryAccess — only added if VeeamRepositoryBucketName is
  #      supplied. Scoped strictly to that bucket (not S3BucketName), with
  #      the actions a backup workload actually needs (Put/Get/List/Delete),
  #      plus a conditional KMS statement if VeeamRepositoryKmsKeyArn is set.
  # -------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: VeeamInstallerReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}/*
        - !If
          - HasRepositoryBucket
          - PolicyName: VeeamRepositoryAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - !If
                  - HasRepositoryKmsKey
                  - Sid: RepositoryKmsAccess
                    Effect: Allow
                    Action:
                      - kms:GenerateDataKey
                      - kms:Decrypt
                    Resource:
                      - !Ref VeeamRepositoryKmsKeyArn
                  - !Ref AWS::NoValue
                - Sid: RepositoryObjectAccess
                  Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                  Resource:
                    - !Sub arn:aws:s3:::${VeeamRepositoryBucketName}/*
                - Sid: RepositoryListAccess
                  Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource:
                    - !Sub arn:aws:s3:::${VeeamRepositoryBucketName}
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${EnvironmentName}-ec2-profile
      Roles:
        - !Ref InstanceRole

  # -------------------------------------------------------------------------
  # EC2 INSTANCE — Windows Server 2025
  # -------------------------------------------------------------------------
  VeeamServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WindowsAMI
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      # ------------------------------------------------------------------
      # IMDSv2 enforced — mitigates SSRF-based credential theft against
      # the IAM role attached to this instance.
      # ------------------------------------------------------------------
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled

      # ------------------------------------------------------------------
      # C: drive — 120 GB (replaces the default root volume)
      # ------------------------------------------------------------------
      BlockDeviceMappings:
        - DeviceName: /dev/sda1 # Root volume → C:
          Ebs:
            VolumeSize: 120
            VolumeType: gp3
            Iops: 3000
            DeleteOnTermination: true
            Encrypted: true

        # ------------------------------------------------------------------
        # D: drive — 450 GB (Veeam repository / backup storage)
        # ------------------------------------------------------------------
        - DeviceName: /dev/xvdf # Secondary EBS → D:
          Ebs:
            VolumeSize: 450
            VolumeType: gp3
            Iops: 3000
            DeleteOnTermination: true
            Encrypted: true

      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-server
        - Key: OS
          Value: Windows Server 2025
        - Key: Application
          Value: Veeam Data Platform Premium v13.1

      # ------------------------------------------------------------------
      # UserData — PowerShell bootstrap (runs once at first boot)
      # ------------------------------------------------------------------
      UserData: !Base64
        Fn::Join:
          - ''
          - - |
              <powershell>
              $script:log = "C:\Windows\Temp\userdata.log"
              function Write-Log {
                param([string]$m)
                $ts = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
                "$ts  $m" | Tee-Object -FilePath $script:log -Append
              }
              Write-Log "=== Bootstrap started ==="

              # ------------------------------------------------------------
              # STEP 1 — Disk D:
              #   Use diskpart (the most reliable method on Windows EC2).
              #   Free the D: letter from the CD-ROM first, then init/format
              #   the 450-GB EBS via a diskpart script.
              # ------------------------------------------------------------

              # 1a. Release D: from CD-ROM if assigned
              $cdVol = Get-WmiObject -Class Win32_Volume -Filter "DriveType=5 AND DriveLetter='D:'" -ErrorAction SilentlyContinue
              if ($cdVol) {
                Write-Log "Releasing D: from CD-ROM..."
                $cdVol.DriveLetter = $null
                $cdVol.Put() | Out-Null
              }

              # 1b. Wait up to 3 min for a disk >= 400 GB to appear (the 450-GB EBS)
              Write-Log "Waiting for 450-GB EBS disk..."
              $disk = $null
              for ($i = 0; $i -lt 36; $i++) {
                $disk = Get-Disk | Where-Object { $_.Size -ge 400GB } | Select-Object -First 1
                if ($disk) { break }
                Start-Sleep -Seconds 5
              }

              if (-not $disk) {
                Write-Log "ERROR: 450-GB disk not found after 180s. Aborting."
              } else {
                Write-Log "Found disk $($disk.Number) — $([math]::Round($disk.Size/1GB,0)) GB — PartitionStyle=$($disk.PartitionStyle)"

                # 1c. Build and run a diskpart script to init + assign D:
                $dpScript = @(
                  "select disk $($disk.Number)",
                  "clean",
                  "convert gpt",
                  "create partition primary",
                  "assign letter=D",
                  "format fs=ntfs label=VeeamData quick",
                  "exit"
                )
                $dpFile = "$env:TEMP\veeam-diskpart.txt"
                $dpScript | Set-Content -Path $dpFile -Encoding ASCII
                $dpResult = & diskpart /s $dpFile 2>&1
                Write-Log "diskpart exit $LASTEXITCODE"
                $dpResult | ForEach-Object { Write-Log "  diskpart: $_" }

                # 1d. Verify the volume appeared
                Start-Sleep -Seconds 5
                if (Test-Path "D:\") {
                  Write-Log "D: volume confirmed OK."
                } else {
                  Write-Log "ERROR: D: not accessible after diskpart."
                }
              }

              # ------------------------------------------------------------
              # STEP 2 — Staging directories
              # ------------------------------------------------------------
              New-Item -ItemType Directory -Force -Path "D:\Veeam\ISO"     | Out-Null
              New-Item -ItemType Directory -Force -Path "D:\Veeam\License" | Out-Null
              New-Item -ItemType Directory -Force -Path "D:\Veeam\Logs"    | Out-Null

              # Move main log to D: now that the volume exists
              $mainLog = "D:\Veeam\Logs\userdata.log"
              Copy-Item -Path $script:log -Destination $mainLog -ErrorAction SilentlyContinue
              $script:log = $mainLog
              Write-Log "Log moved to D:\Veeam\Logs\userdata.log"

              # ------------------------------------------------------------
              # STEP 3 — Install AWS CLI v2
              #   MSI served from s3.amazonaws.com — routed via S3 Gateway
              #   VPC endpoint, no internet gateway needed.
              # ------------------------------------------------------------
              $awsCli = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
              if (-not (Test-Path $awsCli)) {
                Write-Log "AWS CLI not found. Installing..."
                $msiPath = "$env:TEMP\AWSCLIV2.msi"
                try {
                  (New-Object System.Net.WebClient).DownloadFile(
                    "https://s3.amazonaws.com/aws-cli/AWSCLIV2.msi", $msiPath)
                  $exit = (Start-Process msiexec.exe `
                    -ArgumentList "/i `"$msiPath`" /qn /norestart" `
                    -Wait -PassThru).ExitCode
                  if ($exit -ne 0) { throw "msiexec exit $exit" }
                  Write-Log "AWS CLI v2 installed OK."
                } catch {
                  Write-Log "ERROR installing AWS CLI: $_"
                  Write-Log "=== Bootstrap complete (with errors) ==="
                  exit 1
                }
              }
              Write-Log "AWS CLI: $awsCli"

              # ------------------------------------------------------------
              # STEP 4 — Download ISO and license from S3
              # ------------------------------------------------------------
            - |2
                            $isoS3 = '
            - !Ref VeeamISOUrl
            - |2
                            '
                            $licS3 = '
            - !Ref VeeamLicenseUrl
            - |2
                            '
            - |
              $isoDest = "D:\Veeam\ISO\VeeamDataPlatformPremium_v13.1.iso"
              $licDest = "D:\Veeam\License\veeam_license.lic"
              $region  = (Invoke-RestMethod -Uri "http://169.254.169.254/latest/meta-data/placement/region" -UseBasicParsing)
              Write-Log "Region: $region"
              Write-Log "ISO S3  : $isoS3"
              Write-Log "LIC S3  : $licS3"

              Write-Log "Downloading ISO..."
              $r = & $awsCli s3 cp $isoS3 $isoDest --region $region 2>&1
              if ($LASTEXITCODE -ne 0) { Write-Log "ERROR ISO: $r" } else { Write-Log "ISO OK -> $isoDest" }

              Write-Log "Downloading license..."
              $r = & $awsCli s3 cp $licS3 $licDest --region $region 2>&1
              if ($LASTEXITCODE -ne 0) { Write-Log "ERROR LIC: $r" } else { Write-Log "LIC OK -> $licDest" }

              # ------------------------------------------------------------
              # STEP 5 — Desktop README
              # ------------------------------------------------------------
              $rdm = "C:\Users\Public\Desktop\VEEAM_INSTALL_README.txt"
              $sep = "=" * 60
              Set-Content  -Path $rdm -Encoding UTF8 -Value $sep
              Add-Content  -Path $rdm -Encoding UTF8 -Value " Veeam Data Platform Premium v13.1 - Installation Guide"
              Add-Content  -Path $rdm -Encoding UTF8 -Value $sep
              Add-Content  -Path $rdm -Encoding UTF8 -Value ""
              Add-Content  -Path $rdm -Encoding UTF8 -Value "Files ready for installation:"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  ISO     -> D:\Veeam\ISO\VeeamDataPlatformPremium_v13.1.iso"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  License -> D:\Veeam\License\veeam_license.lic"
              Add-Content  -Path $rdm -Encoding UTF8 -Value ""
              Add-Content  -Path $rdm -Encoding UTF8 -Value "Steps:"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  1. Mount the ISO (right-click > Mount)"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  2. Run Setup.exe from the mounted drive"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  3. Point to the .lic file when prompted for license"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "  4. Use D:\VeeamBackup as the backup repository path"
              Add-Content  -Path $rdm -Encoding UTF8 -Value "     (450 GB available on D:)"
              Add-Content  -Path $rdm -Encoding UTF8 -Value ""
              Add-Content  -Path $rdm -Encoding UTF8 -Value "Bootstrap log -> D:\Veeam\Logs\userdata.log"
              Add-Content  -Path $rdm -Encoding UTF8 -Value $sep

              Write-Log "=== Bootstrap complete ==="
              </powershell>

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-VpcId

  PrivateSubnetId:
    Description: Private Subnet ID
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnetId

  InstanceId:
    Description: Veeam Server EC2 Instance ID
    Value: !Ref VeeamServer
    Export:
      Name: !Sub ${EnvironmentName}-InstanceId

  InstancePrivateIP:
    Description: Private IP address of the Veeam server
    Value: !GetAtt VeeamServer.PrivateIp

  SSMConnectCommand:
    Description: Connect to the instance via SSM Session Manager
    Value: !Sub aws ssm start-session --target ${VeeamServer} --region ${AWSRegion}

  ISOPath:
    Description: ISO location on the server (after bootstrap)
    Value: D:\Veeam\ISO\VeeamDataPlatformPremium_v13.1.iso

  LicensePath:
    Description: License file location on the server (after bootstrap)
    Value: D:\Veeam\License\veeam_license.lic

  RepositoryAccessEnabled:
    Description: Whether the optional VeeamRepositoryAccess IAM policy and S3 Gateway Endpoint statement were added
    Value: !If [HasRepositoryBucket, "yes", "no"]
